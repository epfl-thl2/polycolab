# Overlay on compose.yml; supply interpolation and application settings privately.
x-application: &application
  image: ${POLYCOLAB_IMAGE:?Set an immutable application image digest}
  security_opt: ['no-new-privileges:true']
  init: true

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set an explicit database password}
    ports: !reset []
  object-storage:
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Set a production storage RPC secret}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:?Set a production storage access key}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:?Set a production storage secret}
  core:
    <<: *application
    build: !reset null
    environment: !reset {}
    env_file: !override
      - path: ${POLYCOLAB_ENV_FILE:?Set an absolute private application env file}
        required: true
    command:
      [
        'sh',
        '-ec',
        'python -m polycolab.deployment_preflight && python -m polycolab.bootstrap_admin && exec uvicorn polycolab.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers',
      ]
  worker:
    image: ${POLYCOLAB_IMAGE:?Set an immutable application image digest}
    build: !reset null
    environment:
      APP_ENV: production
      RUNTIME_WORKER_TOKEN: ${RUNTIME_WORKER_TOKEN:?Set the private worker token}
