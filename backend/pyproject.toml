[project]
name = "polycolab-api"
version = "0.0.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Polycolab application service foundation"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.17,<2",
  "boto3>=1.42,<2",
  "cryptography>=46,<47",
  "httpx>=0.28,<1",
  "httpcore>=1.0,<2",
  "fastapi==0.141.1",
  "psycopg[binary]>=3.3,<4",
  "pydantic-settings>=2.12,<3",
  "PyJWT[crypto]>=2.10,<3",
  "sqlalchemy>=2.0,<2.1",
  "structlog>=25.5,<26",
  "uvicorn[standard]>=0.41,<0.42",
]

[project.optional-dependencies]
execution = [
    "microsandbox==0.6.18",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "ruff>=0.15,<0.16",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]
addopts = "-q"
pythonpath = ["."]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
exclude = ["migrations"]

[tool.uv.build-backend]
module-name = "polycolab"
module-root = ""

[build-system]
requires = ["uv_build>=0.10.10,<0.11"]
build-backend = "uv_build"
