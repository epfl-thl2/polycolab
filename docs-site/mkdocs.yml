site_name: Polycolab Docs
site_description: Guides for using, configuring, and integrating with Polycolab.
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  variant: modern
  language: en
  font: false
  favicon: /favicon.ico
  logo: /brand/polycolab-mark.png
  custom_dir: overrides
  features:
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - toc.follow
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: lucide/moon
        name: Use dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: lucide/sun
        name: Use light mode

extra_css:
  - styles/brand-tokens.css
  - styles/zensical.css

extra_javascript:
  - scripts/accessibility.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  homepage: /

nav:
  - Index: index.md
  - Getting started: getting-started.md
  - Guides:
      - guides/index.md
      - Workspaces and access: guides/workspaces.md
      - Research and revisions: guides/research.md
      - Collaboration and evidence: guides/collaboration-and-evidence.md
      - Working with agents: guides/agents.md
  - User Setup:
      - setup/index.md
      - Account and security: setup/account-and-security.md
      - Workspace setup: setup/workspace.md
      - External agent: setup/external-agent.md
  - Developers:
      - developers/index.md
      - API fundamentals: developers/api-fundamentals.md
      - Agent runs and contributions: developers/agent-runs.md
      - Documentation components: developers/components.md
  - API reference: api.md
